<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#F5F1E8"/>
  
  <!-- Coffee bag shape -->
  <path d="M120 60 L280 60 L280 240 L120 240 Z" fill="#8B4513" opacity="0.9"/>
  <path d="M120 60 L280 60 L270 70 L130 70 Z" fill="#A0522D"/>
  
  <!-- Bag top fold -->
  <rect x="120" y="50" width="160" height="15" fill="#6B3410" rx="2"/>
  
  <!-- Label area -->
  <rect x="140" y="100" width="120" height="80" fill="#FFF8DC" rx="4"/>
  
  <!-- Coffee beans illustration on label -->
  <ellipse cx="170" cy="130" rx="12" ry="16" fill="#6B4423" transform="rotate(-15 170 130)"/>
  <ellipse cx="190" cy="135" rx="12" ry="16" fill="#8B5A3C" transform="rotate(10 190 135)"/>
  <ellipse cx="210" cy="128" rx="12" ry="16" fill="#6B4423" transform="rotate(-20 210 128)"/>
  <ellipse cx="230" cy="133" rx="12" ry="16" fill="#8B5A3C" transform="rotate(5 230 133)"/>
  
  <!-- Bean center lines -->
  <path d="M170 120 Q170 130 170 140" stroke="#4A2F1A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M190 125 Q190 135 190 145" stroke="#5A3F2A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M210 118 Q210 128 210 138" stroke="#4A2F1A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M230 123 Q230 133 230 143" stroke="#5A3F2A" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Text on label -->
  <text x="200" y="165" font-family="serif" font-size="14" font-weight="bold" fill="#6B4423" text-anchor="middle">COFFEE</text>
  <text x="200" y="175" font-family="serif" font-size="9" fill="#8B7355" text-anchor="middle">BEANS</text>
  
  <!-- Decorative elements -->
  <circle cx="145" cy="155" r="3" fill="#D4AF37"/>
  <circle cx="255" cy="155" r="3" fill="#D4AF37"/>
  
  <!-- Bag stitching details -->
  <line x1="125" y1="70" x2="125" y2="235" stroke="#5A3A1A" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="275" y1="70" x2="275" y2="235" stroke="#5A3A1A" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
