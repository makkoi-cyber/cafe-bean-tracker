<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF0E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD7A8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bagGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- Coffee bag shape -->
  <path d="M120 60 L280 60 L280 240 L120 240 Z" fill="url(#bagGradient)"/>
  <path d="M120 60 L280 60 L270 70 L130 70 Z" fill="#CD853F"/>
  
  <!-- Bag top fold -->
  <rect x="120" y="50" width="160" height="15" fill="#6B4423" rx="2"/>
  
  <!-- Label area -->
  <rect x="140" y="95" width="120" height="90" fill="#FFF8DC" rx="4" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Medium roast coffee beans on label (medium brown) -->
  <ellipse cx="165" cy="125" rx="11" ry="15" fill="#8B4513" transform="rotate(-15 165 125)"/>
  <ellipse cx="185" cy="130" rx="11" ry="15" fill="#A0522D" transform="rotate(10 185 130)"/>
  <ellipse cx="205" cy="123" rx="11" ry="15" fill="#8B4513" transform="rotate(-20 205 123)"/>
  <ellipse cx="225" cy="128" rx="11" ry="15" fill="#A0522D" transform="rotate(5 225 128)"/>
  <ellipse cx="175" cy="145" rx="11" ry="15" fill="#9B5A3C" transform="rotate(-10 175 145)"/>
  <ellipse cx="215" cy="143" rx="11" ry="15" fill="#8B4513" transform="rotate(15 215 143)"/>
  
  <!-- Bean center lines -->
  <path d="M165 115 Q165 125 165 135" stroke="#5A2F1A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M185 120 Q185 130 185 140" stroke="#6A3F2A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M205 113 Q205 123 205 133" stroke="#5A2F1A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M225 118 Q225 128 225 138" stroke="#6A3F2A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M175 135 Q175 145 175 155" stroke="#6A3F2A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M215 133 Q215 143 215 153" stroke="#5A2F1A" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Text on label -->
  <text x="200" y="168" font-family="serif" font-size="13" font-weight="bold" fill="#6B4423" text-anchor="middle">MEDIUM</text>
  <text x="200" y="180" font-family="serif" font-size="10" fill="#8B5A3C" text-anchor="middle">ROAST</text>
  
  <!-- Decorative elements -->
  <circle cx="145" cy="160" r="3" fill="#FFD700"/>
  <circle cx="255" cy="160" r="3" fill="#FFD700"/>
  
  <!-- Bag stitching details -->
  <line x1="125" y1="70" x2="125" y2="235" stroke="#5A3A1A" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="275" y1="70" x2="275" y2="235" stroke="#5A3A1A" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
